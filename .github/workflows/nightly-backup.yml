name: Nightly encrypted full backup

on:
  workflow_dispatch:
  schedule:
    # 23:17 UTC = next day 03:17 Asia/Baku.
    - cron: "17 23 * * *"

permissions:
  contents: read

concurrency:
  group: artmonia-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BACKUP_PROJECT_REF: azhriwieowdeuvbqjqvl
      BACKUP_SUPABASE_URL: https://azhriwieowdeuvbqjqvl.supabase.co
      BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET || 'artmonia-backups' }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_SOURCE_R2_BUCKETS: ${{ vars.BACKUP_SOURCE_R2_BUCKETS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without application generation
        run: npm ci --ignore-scripts
      - name: Install age from the Ubuntu package repository
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Run backup regression tests
        env:
          AGE_TEST_AGE_BIN: age
          AGE_TEST_KEYGEN_BIN: age-keygen
        run: node --test scripts/backup/core.test.mjs scripts/backup/age.test.mjs
      - name: Export, encrypt, upload, verify and retain 30 days
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_DB_CA_CERT: ${{ secrets.BACKUP_DB_CA_CERT }}
          BACKUP_SUPABASE_SERVICE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_KEY }}
          BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_SOURCE_R2_ACCOUNT_ID: ${{ secrets.BACKUP_SOURCE_R2_ACCOUNT_ID }}
          BACKUP_SOURCE_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_SOURCE_R2_ACCESS_KEY_ID }}
          BACKUP_SOURCE_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SOURCE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/backup/run.mjs
      - name: Record failure
        if: failure()
        run: echo 'Full backup failed. Review the failed step; this run must not be treated as a verified backup.' >> "$GITHUB_STEP_SUMMARY"
