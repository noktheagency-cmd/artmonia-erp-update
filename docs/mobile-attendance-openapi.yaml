openapi: 3.1.0
info:
  title: Artmonia ERP Mobile Attendance API
  version: 2.0.0
servers:
  - url: https://erp.artmoniya.com
    description: Production ERP
paths:
  /api/mobile/v1/attendance/check-ins:
    post:
      operationId: createMobileAttendanceCheckIn
      summary: Record attendance from a dynamic v1 or permanent site v2 QR scan
      description: For a v2 site QR, deviceInstallationId is required and ERP resolves the student's current lesson server-side.
      security:
        - serverToken: []
          studentToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
        - name: X-Student-Authorization
          in: header
          required: true
          description: Bearer followed by the signed-in student's Supabase access token
          schema: { type: string, pattern: '^Bearer .+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '200':
          description: New or previously recorded check-in
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInSuccess'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Expired' }
        '422': { $ref: '#/components/responses/WindowClosed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    serverToken:
      type: http
      scheme: bearer
      bearerFormat: opaque server token
    studentToken:
      type: apiKey
      in: header
      name: X-Student-Authorization
  schemas:
    CheckInRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, qrToken, scannedAt]
      properties:
        erpStudentId:
          type: string
          format: uuid
          deprecated: true
          description: Optional legacy field; ERP derives and validates the student from the JWT.
        clientEventId: { type: string, format: uuid }
        qrToken:
          type: string
          minLength: 16
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
        deviceInstallationId:
          type: string
          format: uuid
          description: Required for permanent v2 site QR. Persist one UUID per physical app installation.
        scannedAt: { type: string, format: date-time }
    Lesson:
      type: object
      required: [id, title, startsAt, endsAt, teacherName, location]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        teacherName: { type: string }
        location: { type: string }
    CheckInSuccess:
      type: object
      required: [checkInId, status, message, requestId, lesson, attendance]
      properties:
        checkInId: { type: string, format: uuid }
        status:
          type: string
          enum: [checked_in, already_checked_in]
        message: { type: string }
        requestId: { type: string, format: uuid }
        mode:
          type: string
          enum: [site_qr]
          description: Present only for a permanent v2 site QR check-in.
        site:
          type: object
          description: Present only for a permanent v2 site QR check-in.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            location: { type: [string, 'null'] }
        lesson: { $ref: '#/components/schemas/Lesson' }
        attendance:
          type: object
          required: [status, checkedInAt]
          properties:
            status: { type: string, const: present }
            checkedInAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request or QR token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Invalid server token or missing student access token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Student account is invalid/disabled, identity mismatch, or student is not enrolled
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Student or lesson not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency key conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Expired:
      description: QR token expired
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    WindowClosed:
      description: Check-in window is not open
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests for the student
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Internal ERP failure
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
