openapi: 3.1.0
info:
  title: Artmonia ERP Mobile Student Portal API
  version: 2.1.0
servers:
  - url: https://erp.artmoniya.com
paths:
  /api/mobile/v1/me/access:
    post:
      operationId: resolveMobileAccess
      summary: Resolve member access and securely match a verified Auth account to an existing ERP student
      description: |
        Send no body and no query parameters. Identity is taken only from the verified user JWT
        and live Auth session. An unmatched user is a normal member, not an error.
        Matching never creates a student or ERP staff account. Existing mappings remain authoritative.
        This endpoint must be called before student-only routes and again after a user's enrollment changes.
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Access decision; disabled accounts are returned here but cannot use academic routes
          headers:
            X-Request-Id: { schema: { type: string, format: uuid } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileAccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: UNAUTHORIZED, STUDENT_AUTH_REQUIRED, STUDENT_AUTH_INVALID or EMAIL_NOT_VERIFIED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me:
    get:
      operationId: getMobileMe
      summary: Resolve the signed-in student's ERP mobile account
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Account identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/profile:
    get:
      operationId: getMobileProfile
      summary: Get the student's ERP profile and academy details
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateMobileProfile
      summary: Update student-owned ERP profile fields
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                phone:
                  type: [string, 'null']
                  minLength: 7
                  maxLength: 30
                  description: Use null to remove the current phone number. A string must contain 7 to 15 digits after normalization.
                avatarObjectPath:
                  type: [string, 'null']
                  maxLength: 240
                  pattern: '^[0-9a-f-]{36}/avatar\.(jpg|jpeg|png|webp)$'
      responses:
        '200':
          description: Updated student profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/home:
    get:
      operationId: getMobileHome
      summary: Get ERP-owned data for the student's home dashboard
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Home dashboard data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/lessons:
    get:
      operationId: listMobileLessons
      summary: List the student's lessons and journal entries
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema:
            type: string
            default: all
            enum: [all, scheduled, completed, cancelled, rescheduled, pending, present, absent, excused]
        - name: cursor
          in: query
          description: Opaque cursor returned by nextCursor
          schema: { type: string, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paginated lesson list
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, serverTime]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LessonEntry' }
                  nextCursor: { type: [string, 'null'] }
                  serverTime: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/lessons/{lessonId}:
    get:
      operationId: getMobileLesson
      summary: Get one student-owned lesson journal entry
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lesson entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/homeworks/{homeworkId}/completion:
    put:
      operationId: setMobileHomeworkCompletion
      summary: Removed — use photo/file submission and teacher review
      deprecated: true
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: homeworkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        '410':
          description: HOMEWORK_SUBMISSION_REQUIRED — manual completion has been removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/attendance/summary:
    get:
      operationId: getMobileAttendanceSummary
      summary: Get the student's attendance summary
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Attendance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/package:
    get:
      operationId: getMobilePackage
      summary: Get the student's active package and ERP-calculated lesson balance
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Active package usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/journey:
    get:
      operationId: getMobileJourney
      summary: Get ERP-calculated dynamic program Journey and Fırça
      security: [{ serverToken: [], studentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Dynamic program Journey and Fırça summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/notifications:
    get:
      operationId: listMobileAcademicNotifications
      summary: List ERP-owned academic notifications and announcement history
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Academic notification list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/mobile/v1/me/notifications/{notificationId}/read:
    patch:
      operationId: setMobileAcademicNotificationRead
      summary: Idempotently mark an academic notification read or unread
      security: [{ serverToken: [], studentToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: notificationId
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 180 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: Current notification read state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    serverToken:
      type: http
      scheme: bearer
      bearerFormat: opaque ERP server token
    studentToken:
      type: apiKey
      in: header
      name: X-Student-Authorization
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  schemas:
    MobileAccess:
      type: object
      additionalProperties: false
      required: [contractVersion, authUserId, role, accountStatus, matchStatus, displayName, email, phone, avatarUrl, checkedAt]
      properties:
        contractVersion: { type: integer, const: 1 }
        authUserId: { type: string, format: uuid }
        role: { type: string, enum: [member, student] }
        accountStatus: { type: string, enum: [active, disabled] }
        matchStatus: { type: string, enum: [not_found, matched, review_required] }
        displayName: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'], format: uri }
        checkedAt: { type: string, format: date-time }
    AccountStatus:
      type: string
      enum: [invited, active, disabled]
    Me:
      type: object
      required: [accountStatus, displayName, email, serverTime]
      properties:
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        displayName: { type: string }
        email: { type: string, format: email }
        serverTime: { type: string, format: date-time }
    Academy:
      type: object
      required: [programCode, programName, groupName, studioName, teacherName, studentLevel, enrollmentStatus, lessonsPerMonth]
      properties:
        programCode: { type: string }
        programName: { type: string }
        groupName: { type: [string, 'null'] }
        studioName: { type: [string, 'null'] }
        teacherName: { type: [string, 'null'] }
        studentLevel: { type: [string, 'null'] }
        enrollmentStatus: { type: string, enum: [active] }
        lessonsPerMonth: { type: [integer, 'null'], minimum: 1 }
    LessonTopic:
      type: [object, 'null']
      properties:
        number: { type: integer, minimum: 1 }
        title: { type: string }
    Profile:
      type: object
      required: [displayName, email, phone, avatarUrl, avatarObjectPath, accountStatus, academy, editableFields, updatedAt]
      properties:
        firca: { $ref: './mobile-firca-v1-openapi.yaml#/components/schemas/Firca' }
        displayName: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'], format: uri }
        avatarObjectPath: { type: [string, 'null'] }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        academy:
          anyOf:
            - { $ref: '#/components/schemas/Academy' }
            - { type: 'null' }
        editableFields:
          type: array
          items: { type: string, enum: [phone, avatarObjectPath] }
        updatedAt: { type: string, format: date-time }
    LessonSummary:
      type: object
      required: [id, courseCode, title, topic, startsAt, endsAt, location, teacherName, status]
      properties:
        id: { type: string, format: uuid }
        courseCode: { type: string }
        title: { type: string }
        topic: { $ref: '#/components/schemas/LessonTopic' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'] }
        teacherName: { type: [string, 'null'] }
        status: { type: string, enum: [scheduled, completed, cancelled, rescheduled] }
    Home:
      type: object
      required: [profile, attendance, nextLesson, nextAction, academyNotice, firca, updatedAt]
      properties:
        firca: { $ref: './mobile-firca-v1-openapi.yaml#/components/schemas/Firca' }
        profile:
          type: object
          required: [displayName, avatarUrl, programCode, programName, lessonsPerMonth]
          properties:
            displayName: { type: string }
            avatarUrl: { type: [string, 'null'], format: uri }
            programCode: { type: [string, 'null'] }
            programName: { type: string }
            lessonsPerMonth: { type: [integer, 'null'], minimum: 1 }
        attendance:
          type: object
          required: [weeklyPercent, attendedCount, absentCount, excusedCount, scheduledCount]
          properties:
            weeklyPercent: { type: integer, minimum: 0, maximum: 100 }
            attendedCount: { type: integer, minimum: 0 }
            absentCount: { type: integer, minimum: 0 }
            excusedCount: { type: integer, minimum: 0 }
            scheduledCount: { type: integer, minimum: 0 }
        nextLesson:
          anyOf:
            - { $ref: '#/components/schemas/LessonSummary' }
            - { type: 'null' }
        nextAction:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [homework, teacher_note] }
            entityId: { type: string, format: uuid }
            lessonId: { type: string, format: uuid, description: Present for homework actions }
            title: { type: string }
            body: { type: string }
        academyNotice:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            body: { type: string }
            publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Attendance:
      type: object
      required: [status, markedAt, source]
      properties:
        status: { type: string, enum: [pending, present, absent, excused] }
        markedAt: { type: [string, 'null'], format: date-time }
        source: { type: [string, 'null'], enum: [manual, mobile_qr, automatic, null] }
    Homework:
      type: object
      required: [id, lessonId, title, description, status, submissionStatus, feedback, dueAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        submissionStatus: { type: [string, 'null'], enum: [submitted, accepted, rejected, null] }
        feedback: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, completed, overdue] }
        dueAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    HomeworkCompletion:
      type: object
      required: [homeworkId, status, completedAt, updatedAt]
      properties:
        homeworkId: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed] }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    LessonEntry:
      type: object
      required: [id, date, courseCode, title, objective, topic, startsAt, endsAt, location, teacher, lessonStatus, attendance, teacherNote, homework, updatedAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        courseCode: { type: string }
        title: { type: string }
        objective: { type: [string, 'null'] }
        topic: { $ref: '#/components/schemas/LessonTopic' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'] }
        teacher:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        lessonStatus: { type: string, enum: [scheduled, completed, cancelled, rescheduled] }
        attendance: { $ref: '#/components/schemas/Attendance' }
        teacherNote:
          type: [object, 'null']
          properties:
            text: { type: string }
            createdAt: { type: string, format: date-time }
        homework:
          anyOf:
            - { $ref: '#/components/schemas/Homework' }
            - { type: 'null' }
        updatedAt: { type: string, format: date-time }
    AttendanceSummary:
      type: object
      required: [from, to, attendancePercent, attendedCount, absentCount, excusedCount, pendingCount, scheduledCount, serverTime]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        attendancePercent: { type: integer, minimum: 0, maximum: 100 }
        attendedCount: { type: integer, minimum: 0 }
        absentCount: { type: integer, minimum: 0 }
        excusedCount: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        scheduledCount: { type: integer, minimum: 0 }
        serverTime: { type: string, format: date-time }
    PackageResponse:
      type: object
      required: [package, updatedAt]
      properties:
        package:
          type: object
          required: [id, program, status, startsAt, firstLessonAt, period, billing, lessons]
          properties:
            id: { type: string, format: uuid }
            program:
              type: object
              required: [code, name]
              properties:
                code: { type: [string, 'null'] }
                name: { type: string }
            status: { type: string, enum: [active] }
            startsAt: { type: string, format: date }
            firstLessonAt: { type: [string, 'null'], format: date }
            period:
              type: object
              required: [from, to, source]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                source: { type: string, enum: [billing_cycle, calendar_month] }
            billing:
              type: [object, 'null']
              properties:
                status: { type: string, enum: [draft, open, partial, paid, overdue, void] }
                dueAt: { type: string, format: date }
                paidAt: { type: [string, 'null'], format: date }
            lessons:
              type: object
              required: [totalLessons, usedLessons, remainingLessons, overLimitLessons]
              properties:
                totalLessons: { type: [integer, 'null'], minimum: 0 }
                usedLessons: { type: integer, minimum: 0 }
                remainingLessons: { type: [integer, 'null'], minimum: 0 }
                overLimitLessons: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    JourneyMaterial:
      type: object
      required: [id, subject, objective, homework, imageUrl]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        objective: { type: string }
        homework: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
    JourneyTopic:
      type: object
      required: [identifier, number, title, courseCode, status, access, canViewMaterials, completedAt, materials]
      properties:
        identifier: { type: string, pattern: '^program:[0-9a-f-]{36}:topic:[0-9a-f-]{36}$' }
        number: { type: integer, minimum: 1 }
        title: { type: string }
        courseCode: { type: [string, 'null'] }
        status: { type: string, enum: [completed, current, locked] }
        access: { type: string, enum: [completed, current, preview, locked] }
        canViewMaterials: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
        materials:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/JourneyMaterial' }
    JourneyResponse:
      type: object
      required: [program, journey, contractVersion, firca, updatedAt]
      properties:
        program:
          type: object
          required: [code, name]
          properties:
            code: { type: [string, 'null'] }
            name: { type: string }
        journey:
          type: object
          required: [topics, currentTopic, completedTopicCount, totalTopicCount, progressPercent]
          properties:
            topics:
              type: array
              items: { $ref: '#/components/schemas/JourneyTopic' }
            currentTopic:
              anyOf:
                - { $ref: '#/components/schemas/JourneyTopic' }
                - { type: 'null' }
            completedTopicCount: { type: integer, minimum: 0 }
            totalTopicCount: { type: integer, minimum: 0 }
            progressPercent: { type: integer, minimum: 0, maximum: 100 }
        contractVersion: { type: integer, const: 2 }
        firca: { $ref: './mobile-firca-v1-openapi.yaml#/components/schemas/Firca' }
        updatedAt: { type: string, format: date-time }
    AcademicNotification:
      type: object
      required: [id, type, title, body, readAt, occurredAt, entity, event]
      properties:
        id: { type: string, maxLength: 180 }
        type:
          type: string
          description: Academic type or ERP-defined push category. Unknown categories must render as a generic notification.
        title: { type: string }
        body: { type: string }
        readAt: { type: [string, 'null'], format: date-time }
        occurredAt: { type: string, format: date-time }
        entity:
          type: [object, 'null']
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
        event:
          type: object
          required: [version, name, metadata]
          properties:
            version: { type: integer, const: 1 }
            name:
              type: string
              description: homework.completed is a legacy value; new submission/review events use submitted, accepted, rejected.
              enum: [announcement.published, attendance.updated, homework.assigned, homework.submitted, homework.accepted, homework.rejected, homework.completed, lesson.cancelled, lesson.rescheduled, package.updated, erp.push.published]
            metadata: { type: object, additionalProperties: true }
      examples:
        - id: 'homework:11111111-1111-4111-8111-111111111111:2:1789988400'
          type: homework
          title: Ev tapşırığı qəbul edildi
